<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGL2 Weather Rendering</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1220;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      font-size: 13px;
      line-height: 1.5;
      pointer-events: none;
    }
    .hud h1 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .hud p {
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <div class="hud">
    <h1>WebGL2 Weather Rendering</h1>
    <p id="hud-meta">GFS Wind Field &amp; Transform Feedback Particles (GLSL ES 3.00)</p>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
